<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body bgcolor="mistycolor">

<form>
    <table align="center" width="700" cellpadding="10">
        <tr>

<td colspan="2" align="center">
    <h1>Student Registration Form</h1>
</td>
        </tr>
        <tr>
            <td>Student Name:</td>
            <td><input type="text" size="21" placeholder="First Name"/>

            
<input type="text" size="21" placeholder="Last Name"/></td>
        </tr>
        <tr>
            <td>Father's Name:</td>
            <td><input type="text" size="50" placeholder="Father name" /></td>
                
        </tr>
        <tr>
            <td>Date of Birth:</td>
            <td>
                <input type="text" size="3" placeholder="Day"/>
                <input type="text" size="3" placeholder="Month"/>
                <input type="text" size="8" placeholder="Year"/>
                <i>(DD/MM/YYYY)</i>
            </td>
        </tr>
<tr>
    <td>Mobile Number:</td>
    <td>
        <input type="text" size="1" value="+91" readonly/>
        <input type="text" size="10" placeholder="Mobile Number"/>
    </td>
</tr>
<tr>
    <td>Email:</td>
    <td>
        <input type="text" size="50" placeholder="Email"/>
    </td>
</tr>
<tr>
    <td>Password:</td>
    <td>
        <input type="password" size="50" placeholder="Password"/>
    </td>
</tr>
<tr>
    <td>Gender:</td>
    <td>
        <input type="radio" name="gender" value="male"/> Male
        <input type="radio" name="gender" value="female"/> Female
        <input type="radio" name="gender" value="other"/> Other
    </td>
</tr>
<tr>
    <td>Department:</td>
    <td>
        <select>
            <option>------Select current
                department's -------
            <option value="computer">Computer Science</option>
            <option value="electronics">Electronics</option>
            <option value="mechanical">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
    </td>
</tr>
<tr>
    <td>Course:</td>
    <td>
        <select>
            <option>------Select current
                course's -------
            </option>

            <option value="python">Python</option>
            <option value="java">Java</option>
            <option value="javascript">JavaScript</option>
            <option value="c++">C++</option>
        </select>
    </td>
</tr>
<tr>
    <td>Student Photo:</td>
    <td>
        <input type="file" accept="image/*"/>
    </td>
</tr>
<tr>
    <td>City:</td>
    <td>
        <input type="text" size="50" placeholder="City"/>
        
    </td>
</tr>
<tr>
    <td>Address:</td>
    <td>
        <textarea cols="48" rows="5" placeholder="Enter your address"></textarea>

</tr>
<tr>
    <td colspan="2" align="center">
        <input type="submit" value="Submit"/>
        <input type="reset" value="Reset"/>

    </td>
</tr>














    </table>

</form>

    
</body>
</html>
