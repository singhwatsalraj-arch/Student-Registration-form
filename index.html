<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Registration Form</h1>

    <form id="registrationForm">

        <label>Student ID</label>
        <input type="text" id="studentId" placeholder="Enter Student ID" required>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter Full Name" required>

        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Email" required>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password" required minlength="6">

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Course</label>
        <select id="course" required>
            <option value="">Select Course</option>
            <option>B.Tech</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>BBA</option>
        </select>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="10-digit phone number"
               pattern="[0-9]{10}" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter Address" required></textarea>

        <div class="buttons">
            <button type="submit">Register</button>
            <button type="reset" class="reset">Reset</button>
        </div>

    </form>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
